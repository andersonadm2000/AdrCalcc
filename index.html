<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Endereço oficial do site -->
  <link rel="canonical" href="https://calccpro.pages.dev/">

  <!-- Informações do site -->
  <meta name="title" content="CalccPro">
  <meta name="description" content="CalccPro - FX-991 Simulator">
  <meta property="og:title" content="CalccPro">
  <meta property="og:description" content="CalccPro - FX-991 Simulator">
  <meta property="og:url" content="https://calccpro.pages.dev/">
  <meta property="og:type" content="website">

  <title>CalccPro</title>

  <!-- Estilos e Fontes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f3ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                  #0f172a;
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .btn-key {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-key:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 3px;
      width: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slide-up {
      animation: slideUp 0.4s ease-out forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 text-slate-100 relative overflow-x-hidden">

  <div id="calculator-container" class="w-full max-w-md glass-panel rounded-3xl p-5 sm:p-6 relative overflow-hidden transition-all duration-300">

    <div class="absolute -top-20 -left-20 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex items-center justify-between mb-4 px-1">
      <div class="flex items-center gap-2">
        <span class="p-2 bg-indigo-500/10 rounded-xl text-indigo-400 border border-indigo-500/20">
          <i class="fa-solid fa-calculator text-xs"></i>
        </span>

        <div>
          <h1 class="text-xs font-bold tracking-wider text-slate-200 uppercase">CalccPro</h1>
          <p class="text-[10px] text-slate-400 font-medium">FX-991 Simulator</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="deg-rad-toggle" onclick="toggleAngleMode()" class="text-[10px] font-mono px-2 py-1 rounded-md bg-slate-800 text-indigo-400 border border-slate-700/60 font-semibold hover:bg-slate-700 transition">
          DEG
        </button>

        <div class="flex gap-1.5 ml-1">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500/80 inline-block shadow-sm"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500/80 inline-block shadow-sm"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 inline-block shadow-sm"></span>
        </div>
      </div>
    </div>

    <div class="bg-slate-950/80 rounded-2xl p-4 mb-4 border border-slate-800/80 text-right shadow-inner relative group">
      <div id="expression-display" class="h-6 text-xs text-indigo-300/70 font-mono overflow-x-auto whitespace-nowrap custom-scrollbar mb-1 flex items-center justify-end">
        0
      </div>

      <div id="main-display" class="text-3xl sm:text-4xl font-bold font-mono text-slate-100 overflow-x-auto whitespace-nowrap custom-scrollbar tracking-tight leading-none py-1">
        0
      </div>
    </div>

    <div class="grid grid-cols-5 gap-1.5 sm:gap-2 text-xs sm:text-sm">

      <button onclick="pressKey('CLEAR')" class="btn-key col-span-2 bg-red-500/15 hover:bg-red-500/25 text-red-400 font-semibold p-3 rounded-xl border border-red-500/20 active:bg-red-500/30">AC</button>

      <button onclick="pressKey('DEL')" class="btn-key bg-slate-800/80 hover:bg-slate-700/80 text-amber-400 font-semibold p-3 rounded-xl border border-slate-700/50">
        <i class="fa-solid fa-delete-left"></i>
      </button>

      <button onclick="pressKey('(')" class="btn-key bg-slate-800/60 hover:bg-slate-700/60 text-indigo-300 font-medium p-3 rounded-xl border border-slate-700/40">(</button>

      <button onclick="pressKey(')')" class="btn-key bg-slate-800/60 hover:bg-slate-700/60 text-indigo-300 font-medium p-3 rounded-xl border border-slate-700/40">)</button>

      <button onclick="pressKey('sin(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">sin</button>
      <button onclick="pressKey('cos(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">cos</button>
      <button onclick="pressKey('tan(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">tan</button>
      <button onclick="pressKey('π')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">π</button>
      <button onclick="pressKey('÷')" class="btn-key bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 font-semibold p-3 rounded-xl border border-indigo-500/30">÷</button>

      <button onclick="pressKey('sqrt(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">√</button>
      <button onclick="pressKey('log(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">log</button>
      <button onclick="pressKey('ln(')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">ln</button>
      <button onclick="pressKey('^')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">xⁿ</button>
      <button onclick="pressKey('×')" class="btn-key bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 font-semibold p-3 rounded-xl border border-indigo-500/30">×</button>

      <button onclick="pressKey('7')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">7</button>
      <button onclick="pressKey('8')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">8</button>
      <button onclick="pressKey('9')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">9</button>
      <button onclick="pressKey('e')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">e</button>
      <button onclick="pressKey('-')" class="btn-key bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 font-semibold p-3 rounded-xl border border-indigo-500/30">-</button>

      <button onclick="pressKey('4')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">4</button>
      <button onclick="pressKey('5')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">5</button>
      <button onclick="pressKey('6')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">6</button>
      <button onclick="pressKey('!')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">x!</button>
      <button onclick="pressKey('+')" class="btn-key bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 font-semibold p-3 rounded-xl border border-indigo-500/30">+</button>

      <button onclick="pressKey('1')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">1</button>
      <button onclick="pressKey('2')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">2</button>
      <button onclick="pressKey('3')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">3</button>
      <button onclick="pressKey('%')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">%</button>

      <button onclick="pressKey('=')" class="btn-key row-span-2 bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-400 hover:to-indigo-500 text-white font-bold p-3 rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center text-xl border border-indigo-400/30">=</button>

      <button onclick="pressKey('0')" class="btn-key col-span-2 bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">0</button>
      <button onclick="pressKey('.')" class="btn-key bg-slate-800/90 hover:bg-slate-700 text-white font-bold p-3 rounded-xl border border-slate-700/60">.</button>
      <button onclick="pressKey('Ans')" class="btn-key bg-slate-800/40 hover:bg-slate-700/50 text-indigo-200 font-medium p-3 rounded-xl border border-slate-700/30">Ans</button>

    </div>
  </div>

  <div id="secret-overlay" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md hidden flex-col">

    <div class="w-full bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center px-4">
      <span class="text-xs font-mono text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-lock text-emerald-400"></i> Navegação Interna
      </span>

      <button onclick="closeSecretOverlay()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 hover:text-red-300 font-bold w-9 h-9 rounded-full flex items-center justify-center transition border border-red-500/30 active:scale-95" title="Fechar (ESC)">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <div class="flex-1 w-full h-full relative">

      <iframe
        id="secret-iframe"
        class="w-full h-full border-0"
        src=""
        allow="autoplay; encrypted-media; fullscreen"
        loading="lazy">
      </iframe>

      <div id="creator-badges" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2 items-start transition-all duration-300 animate-slide-up hidden">

        <a href="https://github.com/andersonadm2000/Calccpro"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center gap-2 bg-slate-900/90 text-white px-3.5 py-2 rounded-full border border-indigo-500/40 shadow-2xl backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95">

          <i class="fa-brands fa-github text-indigo-400 text-lg"></i>

          <span class="text-xs font-semibold text-slate-200">
            Código-fonte aberto e verificado
          </span>
        </a>

        <a href="https://www.instagram.com/p.rochaxy_?stkn=MTg1dHRrY25zMHRqbQ=="
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center gap-2 bg-slate-900/90 text-white px-3.5 py-2 rounded-full border border-pink-500/40 shadow-2xl backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95">

          <i class="fa-brands fa-instagram text-pink-500 text-lg"></i>

          <span class="text-xs font-semibold text-slate-200">
            @p.rochaxy_
          </span>
        </a>

      </div>
    </div>
  </div>

  <script>
    let expression = "";
    let lastAnswer = "0";
    let isEvaluated = false;
    let isDegMode = true;
    let instaTimer;

    const SECRET_TRIGGERS = {
      "+0000=": "https://proxypal.net/",
      "+0001=": "https://www.crazygames.com/br/",
      "+0002=": "https://poki.com/br/fps",
      "+0003=": "https://rebrand.ly/361875",
      "+0004=": "https://rebrand.ly/41dba1",
      "+0005=": "https://rebrand.ly/100a7e",
      "+1917=": "https://rebrand.ly/154f5b",
      "++1917=": "https://rebrand.ly/9376f3",
      "+++1917=": "https://rebrand.ly/46d953"
    };

    const mainDisplay = document.getElementById("main-display");
    const expressionDisplay = document.getElementById("expression-display");
    const degRadToggle = document.getElementById("deg-rad-toggle");
    const secretOverlay = document.getElementById("secret-overlay");
    const secretIframe = document.getElementById("secret-iframe");
    const creatorBadges = document.getElementById("creator-badges");

    function toggleAngleMode() {
      isDegMode = !isDegMode;
      degRadToggle.innerText = isDegMode ? "DEG" : "RAD";
    }

    function openSecretOverlay(url) {
      secretIframe.removeAttribute("src");

      setTimeout(() => {
        secretIframe.src = url;
      }, 50);

      creatorBadges.classList.remove("hidden");
      creatorBadges.classList.add("flex");

      secretOverlay.classList.remove("hidden");
      secretOverlay.classList.add("flex");

      clearTimeout(instaTimer);

      instaTimer = setTimeout(() => {
        creatorBadges.classList.add("hidden");
        creatorBadges.classList.remove("flex");
      }, 10000);
    }

    function closeSecretOverlay() {
      secretOverlay.classList.remove("flex");
      secretOverlay.classList.add("hidden");
      clearTimeout(instaTimer);
    }

    function pressKey(key) {

      if (key === '=') {
        const secretCode = expression + "=";

        if (secretCode === "+0001=") {
          window.open(
            "https://www.crazygames.com/br/",
            "_blank",
            "noopener,noreferrer"
          );
          return;
        }

        if (secretCode === "+0002=") {
          window.open(
            "https://poki.com/br/fps",
            "_blank",
            "noopener,noreferrer"
          );
          return;
        }

        if (Object.prototype.hasOwnProperty.call(SECRET_TRIGGERS, secretCode)) {
          openSecretOverlay(SECRET_TRIGGERS[secretCode]);
          return;
        }
      }

      if (key === 'CLEAR') {
        expression = "";
        mainDisplay.innerText = "0";
        expressionDisplay.innerText = "0";
        isEvaluated = false;
        return;
      }

      if (key === 'DEL') {
        if (isEvaluated) {
          expression = "";
          mainDisplay.innerText = "0";
          expressionDisplay.innerText = "0";
          isEvaluated = false;
        } else {
          expression = expression.slice(0, -1);
          mainDisplay.innerText = expression || "0";
        }
        return;
      }

      if (key === '=') {
        if (!expression) return;

        try {
          expressionDisplay.innerText = expression + " =";

          const result = evaluateExpression(expression);

          mainDisplay.innerText = result;
          lastAnswer = String(result);
          expression = String(result);
          isEvaluated = true;

        } catch (error) {
          mainDisplay.innerText = "Erro";
          isEvaluated = true;
        }

        return;
      }

      if (isEvaluated) {
        if (!['+', '-', '×', '÷', '^', '%'].includes(key)) {
          expression = "";
        }

        isEvaluated = false;
      }

      if (key === 'Ans') {
        expression += lastAnswer;
      } else {
        expression += key;
      }

      mainDisplay.innerText = expression;
    }

    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;

      let res = 1;

      for (let i = 2; i <= n; i++) {
        res *= i;
      }

      return res;
    }

    function sin(x) {
      return Math.sin(isDegMode ? x * (Math.PI / 180) : x);
    }

    function cos(x) {
      return Math.cos(isDegMode ? x * (Math.PI / 180) : x);
    }

    function tan(x) {
      return Math.tan(isDegMode ? x * (Math.PI / 180) : x);
    }

    function evaluateExpression(expr) {

      let parsed = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/π/g, 'Math.PI')
        .replace(/\be\b/g, 'Math.E')
        .replace(/sqrt\(/g, 'Math.sqrt(')
        .replace(/sin\(/g, 'sin(')
        .replace(/cos\(/g, 'cos(')
        .replace(/tan\(/g, 'tan(')
        .replace(/log\(/g, 'Math.log10(')
        .replace(/ln\(/g, 'Math.log(')
        .replace(/\^/g, '**');

      parsed = parsed.replace(
        /(\d+)!/g,
        (_, num) => `factorial(${num})`
      );

      parsed = parsed.replace(
        /(\d+(\.\d+)?)%/g,
        '($1/100)'
      );

      const func = new Function(
        'factorial',
        'sin',
        'cos',
        'tan',
        `return ${parsed};`
      );

      let res = func(
        factorial,
        sin,
        cos,
        tan
      );

      if (typeof res === 'number') {
        if (!Number.isInteger(res)) {
          res = Number(res.toFixed(8));
        }
      }

      return res;
    }

    document.addEventListener('keydown', (e) => {

      if (e.key === 'Escape') {

        if (!secretOverlay.classList.contains('hidden')) {
          closeSecretOverlay();
          return;
        } else {
          pressKey('CLEAR');
          return;
        }
      }

      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        pressKey(e.key);
      }

      else if (e.key === '+') {
        pressKey('+');
      }

      else if (e.key === '-') {
        pressKey('-');
      }

      else if (e.key === '*') {
        pressKey('×');
      }

      else if (e.key === '/') {
        e.preventDefault();
        pressKey('÷');
      }

      else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        pressKey('=');
      }

      else if (e.key === 'Backspace') {
        pressKey('DEL');
      }

      else if (e.key === '(' || e.key === ')') {
        pressKey(e.key);
      }
    });
  </script>

</body>
</html>
